<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <link rel="stylesheet" href="/src/output.css">

    <title>Tailwind Task 22</title>
</head>

<body class="bg-white">

    <nav class="w-full border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">

            <h2 class="text-sm font-bold">
                + Project
            </h2>

            <div class="flex items-center gap-5 text-[10px] text-gray-500">
                <a href="#">Product</a>
                <a href="#">Solutions</a>
                <a href="#">Resources</a>
                <a href="#">Pricing</a>
                <a href="#">Log in</a>

                <button class="bg-gray-900 text-white px-3 py-2 rounded-sm">
                    Get it free
                </button>
            </div>

        </div>
    </nav>

    <section class="max-w-6xl mx-auto bg-[#fffaf3] min-h-[480px] relative px-6 pt-10">
        <div class="text-center">

            <h1 class="text-3xl md:text-4xl font-bold leading-tight text-gray-900">
                Write, plan, share.<br>
                With AI at your side.
            </h1>

            <p class="text-[11px] text-gray-500 mt-4 max-w-md mx-auto">
                It's the connected workspace where better, faster work happens.
                Now with AI.
            </p>
            <div class="mt-5 flex justify-center gap-1">

                <button class="bg-gray-900 text-white text-[10px] px-5 py-2">
                    Get it free
                </button>

                <button class="bg-blue-600 text-white text-[10px] px-5 py-2">
                    Request a demo
                </button>

            </div>

        </div>

        <div class="flex justify-center mt-8">

            <img
                src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=600&q=80"
                class="w-[280px] h-[170px] object-cover"
                alt="Project workspace"
            >

        </div>

<div class="absolute left-[12%] top-[300px] bg-white shadow-md px-3 py-2 w-[100px]">

            <div class="flex items-center gap-1">
                <div class="w-2 h-2 bg-purple-400"></div>
                <p class="text-[8px] font-semibold">Tasks</p>
            </div>

            <p class="text-[7px] text-gray-400 mt-1">
                14 tasks completed today
            </p>

        </div>

        <div class="absolute right-[12%] top-[290px] bg-white shadow-md px-3 py-2 w-[110px]">

            <div class="flex items-center gap-1">
                <div class="w-2 h-2 bg-green-400 rounded-full"></div>
                <p class="text-[8px] font-semibold">
                    Project Status
                </p>
            </div>

            <p class="text-[8px] text-green-500 mt-1">
                On track
            </p>

        </div>
        <div class="absolute right-[15%] bottom-[55px] bg-white shadow-md px-3 py-2 w-[120px]">

            <p class="text-[8px] font-semibold">
                Team Activity
            </p>

            <div class="flex items-center mt-2">

                <div class="w-5 h-5 rounded-full bg-gray-300"></div>

                <div class="w-5 h-5 rounded-full bg-gray-400 -ml-1"></div>

                <div class="w-5 h-5 rounded-full bg-gray-500 -ml-1"></div>

                <p class="text-[7px] text-gray-400 ml-2">
                    +5
                </p>

            </div>

        </div>
        <button class="absolute right-4 bottom-4 bg-gray-900 text-white w-5 h-5 text-[9px]">
            *
        </button>

    </section>

</body>

</html>
